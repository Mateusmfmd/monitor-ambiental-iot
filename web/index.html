<!doctype html><meta charset="utf-8"><title>Monitor ambiental</title><h1>Monitor ambiental</h1><p id="status">Aguardando leituras...</p><ul id="readings"></ul><script>async function refresh(){const r=await fetch('/readings');const data=await r.json();document.querySelector('#status').textContent=data.length+' leituras recebidas';document.querySelector('#readings').innerHTML=data.map(x=>`<li>${x.metric}: ${x.value}</li>`).join('')}setInterval(refresh,2000);refresh();</script>
